services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    environment:
      APP_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: vue_admin
      MYSQL_USER: vue_admin
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  legacy:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./legacy-frontend:/usr/share/nginx/html:ro
      - ./docker/legacy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  frontend:
    image: node:22-alpine
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-vue:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  db_data:
  frontend_node_modules:
